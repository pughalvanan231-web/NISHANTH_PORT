<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="prBg" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#240b47"/>
      <stop offset="100%" stop-color="#0b0217"/>
    </radialGradient>
    <filter id="prGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#8b5cf6" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect x="25" y="25" width="350" height="350" rx="80" fill="url(#prBg)" stroke="#8b5cf6" stroke-width="4" filter="url(#prGlow)"/>
  <rect x="40" y="40" width="320" height="320" rx="65" fill="none" stroke="#a78bfa" stroke-width="1.5" stroke-opacity="0.3"/>
  <!-- Pr Monogram -->
  <text x="200" y="235" fill="#c084fc" font-family="'Space Grotesk', system-ui, sans-serif" font-size="140" font-weight="800" text-anchor="middle" letter-spacing="-4">Pr</text>
  <!-- Subtitle -->
  <rect x="90" y="275" width="220" height="36" rx="18" fill="#581c87" fill-opacity="0.7" stroke="#9333ea" stroke-width="1.5"/>
  <text x="200" y="299" fill="#f3e8ff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="2">PREMIERE PRO</text>
