<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181a20"/>
      <stop offset="100%" stop-color="#0a0b0d"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="whiteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d0d5dd"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#00f2fe" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Squircle Base -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" stroke="#262b35" stroke-width="6"/>
  <!-- CapCut Stylized Interlocking Ribbons -->
  <g filter="url(#glow)">
    <!-- Top Left Ribbon -->
    <path d="M 140 160 L 250 160 L 290 220 L 180 220 Z" fill="url(#whiteGrad)"/>
    <!-- Top Right Ribbon -->
    <path d="M 372 160 L 262 160 L 222 220 L 332 220 Z" fill="url(#cyanGrad)"/>
    <!-- Bottom Left Ribbon -->
    <path d="M 180 292 L 290 292 L 250 352 L 140 352 Z" fill="url(#cyanGrad)"/>
    <!-- Bottom Right Ribbon -->
    <path d="M 332 292 L 222 292 L 262 352 L 372 352 Z" fill="url(#whiteGrad)"/>
    <!-- Center Cut Diamond Accents -->
    <circle cx="256" cy="256" r="14" fill="#ffffff" opacity="0.9"/>
  </g>
  <!-- Label pill -->
  <rect x="166" y="394" width="180" height="36" rx="18" fill="#13171e" stroke="#00f2fe" stroke-width="2" opacity="0.9"/>
  <text x="256" y="418" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#00f2fe" text-anchor="middle" letter-spacing="3">CAPCUT PRO</text>
</svg>