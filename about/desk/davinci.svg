<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="dvBg" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#20222a"/>
      <stop offset="100%" stop-color="#0c0d11"/>
    </radialGradient>
    <filter id="dvGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#ef4444" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect x="25" y="25" width="350" height="350" rx="80" fill="url(#dvBg)" stroke="#38bdf8" stroke-width="3" filter="url(#dvGlow)"/>
  <!-- DaVinci Pinwheels -->
  <g transform="translate(200, 175) scale(0.95)">
    <!-- Top-Right Red/Orange petal -->
    <path d="M 0 0 C 35 -60, 95 -45, 95 0 C 95 45, 45 45, 0 0 Z" fill="#ef4444" fill-opacity="0.9"/>
    <!-- Bottom Yellow/Green petal -->
    <path d="M 0 0 C 60 35, 45 95, 0 95 C -45 95, -45 45, 0 0 Z" fill="#eab308" fill-opacity="0.9"/>
    <!-- Left Cyan/Blue petal -->
    <path d="M 0 0 C -60 -35, -45 -95, 0 -95 C 45 -95, 45 -45, 0 0 Z" fill="#06b6d4" fill-opacity="0.9"/>
    <!-- Center white node -->
    <circle cx="0" cy="0" r="16" fill="#ffffff" filter="drop-shadow(0 0 8px rgba(255,255,255,0.8))"/>
  </g>
  <rect x="80" y="275" width="240" height="36" rx="18" fill="#1e293b" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="200" y="299" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="2">DAVINCI RESOLVE</text>
</svg>