<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="camBg" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#222530"/>
      <stop offset="100%" stop-color="#0d0f14"/>
    </radialGradient>
    <filter id="camGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#eab308" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="25" y="25" width="350" height="350" rx="80" fill="url(#camBg)" stroke="#eab308" stroke-width="3" filter="url(#camGlow)"/>
  <!-- Cinema Camera Body -->
  <rect x="105" y="115" width="160" height="120" rx="20" fill="#1e222d" stroke="#333846" stroke-width="2"/>
  <!-- Gold Cinema Lens -->
  <circle cx="185" cy="175" r="42" fill="#0f1117" stroke="#eab308" stroke-width="5"/>
  <circle cx="185" cy="175" r="28" fill="#090a0d" stroke="#facc15" stroke-width="2"/>
  <circle cx="185" cy="175" r="14" fill="#0369a1"/>
  <!-- Top Handle -->
  <path d="M 125 115 L 125 90 L 225 90 L 225 115" fill="none" stroke="#475569" stroke-width="8" stroke-linecap="round"/>
  <!-- EVF Eyepiece -->
  <rect x="265" y="145" width="30" height="35" rx="6" fill="#334155"/>
  <rect x="90" y="275" width="220" height="36" rx="18" fill="#422006" fill-opacity="0.8" stroke="#eab308" stroke-width="1.5"/>
  <text x="200" y="299" fill="#fef08a" font-family="system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle" letter-spacing="2">CINEMA 4K RAW</text>
</svg>